<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>North City | ルール管理</title><link rel="stylesheet" href="admin.css"></head><body>
<header class="head"><a href="/">North City</a><span>ルール管理</span></header><main class="shell">
<section id="login" class="card login"><h1>管理画面</h1><p>運営用パスワードを入力してください。</p><input id="token" type="password" placeholder="管理パスワード"><button id="loginBtn" class="primary">ログイン</button><p id="msg"></p></section>
<section id="app" hidden><div class="top"><div><h1>ルール管理</h1><p>大タイトル → 中タイトル → 小タイトル（ルール）で管理します。</p></div><button id="logout">ログアウト</button></div>
<nav class="tabs"><button class="tab active" data-tab="rules">小タイトル・ルール</button><button class="tab" data-tab="middles">中タイトル</button><button class="tab" data-tab="majors">大タイトル</button></nav>
<section id="rules" class="pane"><div class="filters"><button data-s="all" class="active">すべて</button><button data-s="published">公開中</button><button data-s="draft">下書き</button><button data-s="retired">廃止済み</button></div>
<div class="grid"><aside class="card side"><div class="sideHead"><b>ルール一覧</b><button id="newRule">＋新規</button></div><input id="search" placeholder="検索"><div id="ruleList"></div></aside>
<section class="card editor"><div class="editorHead"><h2 id="editorTitle">新しいルール</h2><span id="status" class="badge draft">下書き</span></div>
<form id="form"><div class="two"><label>大タイトル<select id="major"><option value="">未分類</option></select></label><label>中タイトル<select id="middle"><option value="">未分類</option></select></label></div>
<div class="two"><label>重要度<select id="type"><option value="normal">通常</option><option value="note">補足</option><option value="caution">注意</option><option value="important">重要</option><option value="prohibited">禁止</option></select></label><label>旧カテゴリ<input id="category"></label></div>
<label>ルール名<input id="title" required></label><label>短い説明<input id="summary"></label><label>本文<textarea id="content" rows="8" required></textarea></label>
<div class="subbox"><div class="subhead"><b>長い補足・例外</b><label class="check"><input id="collapsed" type="checkbox" checked>折りたたむ</label></div><textarea id="details" rows="5"></textarea></div>
<label>今回の更新内容<input id="note" placeholder="例：条件を分かりやすく変更"></label><label class="check pub"><input id="published" type="checkbox" checked>公開する</label>
<details><summary>詳細設定</summary><label>検索用キーワード<input id="keywords"></label><label>固定URL用ID<input id="slug"></label></details>
<div class="preview"><b>プレビュー</b><small id="path">未分類</small><h3 id="pvTitle">ルール名</h3><p id="pvContent">本文が表示されます。</p><details id="pvDetails" hidden><summary>詳しく見る</summary><p id="pvDetailText"></p></details></div>
<div class="bar"><div><button type="button" id="up">↑上へ</button><button type="button" id="down">↓下へ</button><button type="button" id="dup">複製</button><button type="button" id="diff">変更差分</button><button type="button" id="hist">履歴</button></div><div><button type="button" id="restore" hidden>復元</button><button type="button" id="retire">廃止</button><button type="button" id="hard" class="danger" hidden>完全削除</button><button class="primary" type="submit">保存</button></div></div>
</form></section></div></section>
<section id="middles" class="pane" hidden><div class="card manager"><div class="managerHead"><div><h2>中タイトル</h2><p>同じ大タイトルの中だけで順番を変えます。</p></div><button id="addMiddle" class="primary">＋中タイトル</button></div><div id="middleList"></div></div></section>
<section id="majors" class="pane" hidden><div class="card manager"><div class="managerHead"><div><h2>大タイトル</h2><p>大タイトル同士の順番を変えます。</p></div><button id="addMajor" class="primary">＋大タイトル</button></div><div id="majorList"></div></div></section>
</section></main>
<dialog id="modal"><div class="modalHead"><b id="modalTitle"></b><button id="close">×</button></div><div id="modalBody"></div></dialog>
<script src="admin.js?v=2"></script></body></html>
