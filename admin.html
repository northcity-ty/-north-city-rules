<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>North City | ルール管理</title><link rel="stylesheet" href="admin.css"></head><body>
<header class="admin-header"><div class="admin-header-inner"><a href="/" class="admin-brand">North City</a><span>ルール管理</span></div></header>
<main class="admin-shell"><section id="loginView" class="panel login-panel"><p class="eyebrow">ADMIN</p><h1>管理画面</h1><p class="help">運営用の管理パスワードを入力してください。</p><label class="field"><span>管理パスワード</span><input id="adminToken" type="password"></label><button id="loginButton" class="button primary">ログイン</button><p id="loginMessage" class="message"></p></section>
<section id="adminView" hidden><div class="top-actions"><div><p class="eyebrow">RULE MANAGER</p><h1>ルール管理</h1><p class="help">大タイトル → 中タイトル → 小タイトル（ルール）の順に整理します。</p></div><button id="logoutButton" class="button secondary">ログアウト</button></div>
<nav class="manager-tabs"><button class="tab active" data-tab="rules">小タイトル・ルール</button><button class="tab" data-tab="middles">中タイトル</button><button class="tab" data-tab="majors">大タイトル</button></nav>
<section id="tab-rules" class="tab-panel"><div class="status-tabs"><button class="status-tab active" data-status="all">すべて</button><button class="status-tab" data-status="published">公開中</button><button class="status-tab" data-status="draft">下書き</button><button class="status-tab" data-status="retired">廃止済み</button></div>
<div class="admin-grid"><aside class="panel rule-list-panel"><div class="list-head"><div class="list-head-row"><strong>ルール一覧</strong><button id="newRuleButton" class="mini-button">＋ 新規</button></div><input id="adminSearch" type="search" placeholder="ルールを検索"></div><div id="ruleList" class="rule-list"></div></aside>
<section class="panel editor-panel"><div class="editor-head"><div><p class="eyebrow">EDIT</p><h2 id="editorTitle">新しいルール</h2></div><span id="statusBadge" class="status-badge draft">下書き</span></div><form id="ruleForm">
<div class="form-grid two"><label class="field"><span>大タイトル</span><select id="majorId"><option value="">未分類</option></select></label><label class="field"><span>中タイトル</span><select id="middleId"><option value="">未分類</option></select></label></div>
<div class="form-grid two"><label class="field"><span>重要度</span><select id="displayType"><option value="normal">通常</option><option value="note">補足</option><option value="caution">注意</option><option value="important">重要</option><option value="prohibited">禁止</option></select></label><label class="field"><span>旧カテゴリ</span><input id="category"></label></div>
<label class="field"><span>ルール名</span><input id="title" required></label><label class="field"><span>短い説明</span><input id="summary"></label><label class="field"><span>本文</span><textarea id="content" rows="8" required></textarea></label>
<div class="details-box"><div class="details-head"><div><strong>長い補足・例外</strong><small>必要なときだけ使います。</small></div><label class="switch-line"><input id="detailsCollapsed" type="checkbox" checked><span>折りたたんで表示</span></label></div><textarea id="details" rows="5"></textarea></div>
<label class="field"><span>今回の更新内容</span><input id="changeNote"></label><div class="publish-box"><label class="switch-line large"><input id="isPublished" type="checkbox" checked><span><strong>公開する</strong><small>OFFなら下書きです。</small></span></label></div>
<details class="advanced"><summary>詳細設定を開く</summary><div class="advanced-body"><label class="field"><span>検索用キーワード</span><input id="keywords"></label><label class="field"><span>固定URL用ID</span><input id="slug"></label></div></details>
<div class="preview-box"><div class="preview-head"><strong>プレビュー</strong><span id="previewPath">未分類</span></div><article class="preview-card"><h3 id="previewTitle">ルール名</h3><p id="previewContent">本文が表示されます。</p><details id="previewDetails" hidden><summary>詳しく見る</summary><p id="previewDetailsText"></p></details></article></div>
<div class="save-bar"><div class="tool-buttons"><button id="moveUpButton" type="button" class="button secondary">↑ 上へ</button><button id="moveDownButton" type="button" class="button secondary">↓ 下へ</button><button id="duplicateButton" type="button" class="button secondary">複製</button><button id="diffButton" type="button" class="button secondary">変更差分</button><button id="historyButton" type="button" class="button secondary">履歴</button></div><div class="danger-actions"><button id="restoreButton" type="button" class="button secondary" hidden>復元</button><button id="retireButton" type="button" class="button danger">廃止</button><button id="hardDeleteButton" type="button" class="button danger-solid" hidden>完全削除</button><button type="submit" class="button primary big">保存する</button></div></div>
</form></section></div></section>
<section id="tab-middles" class="tab-panel" hidden><div class="panel title-manager"><p class="eyebrow">MIDDLE TITLES</p><h2>中タイトル</h2><p class="help">大タイトルを選ぶと、その中の中タイトルだけ表示します。</p><div class="inline-editor"><label class="field"><span>大タイトル</span><select id="middleMajorSelect"><option value="">選択してください</option></select></label><label class="field"><span>中タイトル名</span><input id="middleTitleInput" placeholder="例：人質・逃走"></label><div class="inline-actions"><button id="cancelMiddleEdit" class="button secondary" type="button" hidden>キャンセル</button><button id="saveMiddleButton" class="button primary" type="button">中タイトルを追加</button></div></div><div id="middleList" class="title-list"></div></div></section>
<section id="tab-majors" class="tab-panel" hidden><div class="panel title-manager"><p class="eyebrow">MAJOR TITLES</p><h2>大タイトル</h2><p class="help">サイトで最初に選ぶ大きな分類です。</p><div class="inline-editor"><label class="field"><span>大タイトル名</span><input id="majorTitleInput" placeholder="例：犯罪ルール"></label><div class="inline-actions"><button id="cancelMajorEdit" class="button secondary" type="button" hidden>キャンセル</button><button id="saveMajorButton" class="button primary" type="button">大タイトルを追加</button></div></div><div id="majorList" class="title-list"></div></div></section>
</section></main>
<dialog id="infoDialog"><div class="dialog-head"><strong id="dialogTitle"></strong><button id="closeDialog" class="icon-button">×</button></div><div id="dialogBody" class="dialog-body"></div></dialog><script src="admin.js?v=3"></script></body></html>
